<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OG Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>OG Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,500;0,700;1,600;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
/* Plan visual: identidad OG = negro y blanco, tipografía deportiva en itálica.
   Layout: sidebar negro fijo + área de trabajo clara u oscura. Azul = ingresos, naranja = egresos. */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --surface-2:#F6F6F3; --ink:#0A0A0A; --ink-2:#4D4D52; --ink-3:#85858B; --line:#E2E2DC;
  --btn-bg:#0A0A0A; --btn-ink:#FFFFFF;
  --s1:#2a78d6; --s2:#eb6834; --g:#12d160; --r:#ff3b4a; --inc:#079a47; --exp:#e0182d;
  --ok:#16803c; --warn:#9a6200; --bad:#c92f2f; --ok-bg:#e1f3e7; --warn-bg:#fcefd0; --bad-bg:#fde4e4;
  --shadow:0 1px 2px rgba(10,10,10,.05),0 8px 24px rgba(10,10,10,.05);
  --display:"Saira",system-ui,-apple-system,"Segoe UI",sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --side:#0A0A0A; --side-ink:#F3F3F0; --side-dim:#8C8C90; --side-line:#222;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080808; --surface:#141414; --surface-2:#1b1b1b; --ink:#F3F3F0; --ink-2:#B9B9B3; --ink-3:#7E7E82; --line:#272727;
  --btn-bg:#F3F3F0; --btn-ink:#0A0A0A; --s1:#3987e5; --s2:#d95926; --g:#2be07a; --r:#ff5560; --inc:#3df08a; --exp:#ff6b73;
  --ok:#47c27a; --warn:#e3a52a; --bad:#ef6b6b; --ok-bg:#14301e; --warn-bg:#33270c; --bad-bg:#3a1717;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#080808; --surface:#141414; --surface-2:#1b1b1b; --ink:#F3F3F0; --ink-2:#B9B9B3; --ink-3:#7E7E82; --line:#272727;
  --btn-bg:#F3F3F0; --btn-ink:#0A0A0A; --s1:#3987e5; --s2:#d95926; --g:#2be07a; --r:#ff5560; --inc:#3df08a; --exp:#ff6b73;
  --ok:#47c27a; --warn:#e3a52a; --bad:#ef6b6b; --ok-bg:#14301e; --warn-bg:#33270c; --bad-bg:#3a1717;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.45); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;border-right:1px solid var(--side-line);overflow-y:auto;z-index:30}
.brand{padding:4px 10px 22px}
.brand img{display:block;width:118px;height:auto}
.brand small{display:block;margin-top:8px;color:var(--side-dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;color:var(--side-dim);text-decoration:none;border-radius:10px;font-weight:500;position:relative}
.nav a:hover{color:var(--side-ink);background:#161616}
.nav a[aria-current="page"]{color:#0A0A0A;background:#F3F3F0;font-weight:600}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-9px;top:10px;bottom:10px;width:4px;background:#F3F3F0;transform:skewX(-14deg)}
.sidefoot{border-top:1px solid var(--side-line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sync{font-size:12px;color:var(--side-dim);display:flex;align-items:center;gap:8px;padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--side-dim);flex:none}
.dot.ok{background:#47c27a}.dot.err{background:#ef6b6b}
.sidebtn{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--side-line);color:var(--side-ink);padding:9px 12px;border-radius:10px;width:100%}
.sidebtn:hover{background:#161616}
.main{min-width:0;padding:0 clamp(16px,3vw,36px) 48px}
.top{display:flex;align-items:center;gap:12px;padding:22px 0 18px;position:sticky;top:0;background:var(--bg);z-index:20}
.top h1{font-size:clamp(24px,3.2vw,34px);font-style:italic;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.burger{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:11px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.icon{padding:8px;border-radius:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.card h2{font-size:16px;font-weight:700;letter-spacing:.01em;margin-bottom:4px}
.card .sub{color:var(--ink-3);font-size:13px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.hero{background:#0A0A0A;color:#F3F3F0;border-radius:18px;padding:22px 26px;display:flex;align-items:center;gap:24px;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden;border:1px solid #1d1d1d}
.hero::after{content:"";position:absolute;right:-40px;top:-20px;bottom:-20px;width:46%;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.05) 22px 34px);pointer-events:none}
.hero img{width:130px;height:auto;display:block;position:relative;z-index:1}
.hero .hl{display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.hero .hl span{color:#8C8C90;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.hero .hr{position:relative;z-index:1;text-align:right}
.hero .hr span{display:block;color:#8C8C90;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.hero .hr strong{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(28px,4vw,40px);font-variant-numeric:tabular-nums;line-height:1.1}
.hero .hr small{color:#8C8C90}
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px}
.kl{color:var(--ink-3);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.kv{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(20px,2.2vw,27px);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.ks{color:var(--ink-3);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.neg{color:var(--bad)}
.chartbox{position:relative;height:250px}
.chartbox.tall{height:300px}
.empty{color:var(--ink-3);padding:26px 12px;text-align:center;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-style:italic;font-size:17px;margin-bottom:4px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink)}
.seg.t3 button[data-t="income"][aria-pressed="true"]{background:var(--inc);color:var(--btn-ink)}
.seg.t3 button[data-t="expense"][aria-pressed="true"]{background:var(--exp);color:var(--btn-ink)}
.legend{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .pct{color:var(--ink-3);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:center}
.split .chartbox{height:190px;max-width:260px;width:100%;margin:0 auto}
.per{display:grid;grid-template-columns:1fr;gap:10px}
.per>div{background:var(--surface-2);border-radius:12px;padding:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.per h3{font-size:13px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.per .tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.per .tri span{display:block;color:var(--ink-3);font-size:12px}
.per .tri b{display:block;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.bar{height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink)}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.goal i{background:var(--s1)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:7px}
.cdot{width:10px;height:10px;border-radius:3px;flex:none}
.mlist{display:flex;flex-direction:column}
.mhead,.mrow{display:grid;grid-template-columns:104px minmax(0,2.2fr) minmax(0,1.3fr) minmax(0,1.2fr) 128px 76px;gap:12px;align-items:center;padding:11px 8px}
.mhead{color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--line)}
.mhead button{all:unset;cursor:pointer}
.mhead button:hover{color:var(--ink)}
.mrow{border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--surface-2)}
.mrow .d b{display:block;font-weight:600;overflow-wrap:anywhere}
.mrow .d small{color:var(--ink-3);font-size:12.5px;overflow-wrap:anywhere}
.mrow .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.mrow .act{display:flex;justify-content:flex-end;gap:2px}
.mrow .act button{background:transparent;border:0;padding:6px;border-radius:8px;color:var(--ink-3)}
.mrow .act button:hover{background:var(--line);color:var(--ink)}
.mini{display:flex;flex-direction:column}
.mini .it{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.mini .it:last-child{border-bottom:0}
.mini .it b{font-weight:600}
.mini .it small{display:block;color:var(--ink-3);font-size:12.5px}
.filters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.input,.select,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.input:focus,.select:focus{border-color:var(--ink-2)}
.sbox{position:relative}.sbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}.sbox .input{padding-left:34px}
.amtbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface-2)}
.amtbox span{font-family:var(--display);font-style:italic;font-weight:700;font-size:26px;color:var(--ink-3)}
.amtbox input{border:0;background:transparent;font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;width:100%;outline:none;font-variant-numeric:tabular-nums;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:13.5px;min-height:20px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:680px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:20px;font-style:italic;font-weight:800}
.mb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.crow input[type=color],.cadd input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cadd{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:4px}
.gcard,.acard,.bcard{display:flex;flex-direction:column;gap:12px}
.gcard header,.acard header,.bcard header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.gcard h3,.acard h3,.bcard h3{font-size:18px;font-weight:700}
.big{font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kvs div{display:flex;flex-direction:column}
.kvs small{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kvs b{font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:right;color:var(--ink-3);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t th:first-child,table.t td:first-child{text-align:left}
.scroll{overflow-x:auto}
.note{color:var(--ink-3);font-size:13px}
.backdrop{display:none}
.sh{display:none}
@media (max-width:1180px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .22s ease}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}
  .burger{display:inline-flex}
  .g21,.g2,.g3{grid-template-columns:1fr}
  .nav a[aria-current="page"]::before{display:none}
}
@media (max-width:720px){
  .top .sh{display:inline}
  .g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g5>.kpi:first-child{grid-column:1/-1}
  .mhead{display:none}
  .mrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 4px}
  .mrow .dt{grid-column:1;grid-row:2;color:var(--ink-3);font-size:12.5px}
  .mrow .d{grid-column:1;grid-row:1}
  .mrow .amt{grid-column:2;grid-row:1}
  .mrow .cat{grid-column:1;grid-row:3;font-size:12.5px;color:var(--ink-2)}
  .mrow .acc{display:none}
  .mrow .act{grid-column:2;grid-row:2/4;align-items:center}
  .fgrid{grid-template-columns:1fr}
  .kvs{grid-template-columns:1fr 1fr}
  .hero{padding:18px}.hero .hr{text-align:left}
  .top .lg{display:none}
}
/* impacto visual */
body{background-image:repeating-linear-gradient(115deg,transparent 0 46px,color-mix(in srgb,var(--ink) 2.4%,transparent) 46px 48px);background-attachment:fixed}
.card{border-radius:18px;transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.kpi:hover,.card.lift:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(10,10,10,.06),0 18px 40px rgba(10,10,10,.12);border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.card>h2::before,.card>.sec h2::before,.card>.sec>div>h2::before{content:"";display:inline-block;width:6px;height:16px;background:var(--ink);transform:skewX(-16deg);margin-right:10px;vertical-align:-2px;border-radius:1px}
.top h1::after{content:"";display:block;width:64px;height:5px;background:var(--btn-bg);transform:skewX(-30deg);margin-top:7px;border-radius:1px}
.kpi{position:relative;overflow:hidden;padding:18px 18px 16px;--kacc:var(--ink)}
.kpi:has(.kv.inc),.kpi:has(.kv.exp),.kpi:has(.kv.neg){--ko:.11}
.kpi:has(.kv.inc){--kacc:var(--g)}.kpi:has(.kv.exp){--kacc:var(--r)}.kpi:has(.kv.neg){--kacc:var(--bad)}
.kpi::after{content:"";position:absolute;right:-22px;top:-12px;width:64px;height:140%;background:var(--kacc);opacity:var(--ko,.06);transform:skewX(-18deg);pointer-events:none}
.kpi::before{content:"";position:absolute;left:0;top:0;height:4px;width:46%;background:var(--kacc);transform:skewX(-30deg);transform-origin:top left;border-radius:0 0 2px 0}
.kpi{container-type:inline-size}
.kv{font-size:clamp(18px,12.8cqw,34px);line-height:1.1;position:relative;z-index:1}
.hero{padding:30px 34px;gap:28px;background:radial-gradient(560px 240px at 100% 0%,rgba(255,255,255,.13),transparent 70%),radial-gradient(460px 220px at 0% 110%,rgba(255,255,255,.07),transparent 70%),#0A0A0A;border-color:#222;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.hero img{width:156px;filter:drop-shadow(0 4px 22px rgba(255,255,255,.18))}
.hero::after{width:52%;background:repeating-linear-gradient(115deg,transparent 0 24px,rgba(255,255,255,.055) 24px 38px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%)}

    openModal(title,'<p style="margin:0;color:var(--ink-2)">'+msg+'</p><div class="mf"><button class="btn" id="cNo">Cancelar</button><button class="btn '+(danger?'danger':'primary')+'" id="cYes">'+esc(okLabel||'Aceptar')+'</button></div>');
    $('#cNo').onclick=function(){closeModal();resolve(false)};
    $('#cYes').onclick=function(){closeModal();resolve(true)};
  });
}
var opts=function(list,sel,ph){return (ph!=null?'<option value="">'+esc(ph)+'</option>':'')+list.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===sel?' selected':'')+'>'+esc(x[1])+'</option>'}).join('')};

function applyTheme(){var t=S.settings.theme;if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}
function effTheme(){var a=document.documentElement.getAttribute('data-theme');return a||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function themeBtn(){var d=effTheme()==='dark';$('#themeBtn').innerHTML=icon(d?'sun':'moon')+'<span>'+(d?'Modo claro':'Modo oscuro')+'</span>'}

/* ---------- vistas ---------- */
var kpi=function(l,v,s,cls,xc,cc){return '<div class="kpi card '+(xc||'')+'"><span class="kl">'+l+'</span><strong class="kv '+(cls||'')+'"'+(cc!=null?' data-c="'+cc+'"':'')+'>'+v+'</strong><span class="ks">'+(s||'&nbsp;')+'</span></div>'};
var chipCat=function(id){var c=catById(id);return '<span class="chip"><i class="cdot" style="background:'+(c?c.color:'#9a9aa0')+'"></i>'+esc(c?c.name:'Sin categoría')+'</span>'};
function budgetStatus(spent,limit){
  var p=limit>0?spent/limit:0;
  if(p>1)return {cls:'bad',label:'Excedido',ic:'alert',p:p};
  if(p>=.8)return {cls:'warn',label:'Cerca del límite',ic:'alert',p:p};
  return {cls:'ok',label:'Dentro del límite',ic:'check',p:p};
}
function budgetRows(off){
  var r=rangeOf('month',off),map=expenseByCat(r.s,r.e);
  return S.budgets.map(function(b){var cat=catById(b.categoryId);if(!cat)return null;var spent=map[b.categoryId]||0,lim=cents(b.limit);return {b:b,cat:cat,spent:spent,lim:lim,st:budgetStatus(spent,lim)}}).filter(Boolean).sort(function(a,b){return b.st.p-a.st.p});
}
function empty(t,s){return '<div class="empty"><strong>'+t+'</strong>'+(s||'')+'</div>'}

function icoKind(name){
  var n=String(name||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/salario|sueldo|nomina/.test(n))return 'whistle';
  if(/nutri|entren|consulta|dieta/.test(n))return 'nutri';
  if(/masaj|terapia|spa/.test(n))return 'stones';
  if(/suplement|vitamin|proteina/.test(n))return 'tub';
  if(/carn|res\b|pollo|cerdo/.test(n))return 'steak';
  if(/ropa|playera|prenda|vestid|textil/.test(n))return 'shirt';
  if(/jugo|fruta|bolsa|bebida/.test(n))return 'juice';
  return 'coin';
}
function ico3d(name,px){
  var u='ic'+(icoN++);
  return '<svg class="ico3d" width="'+px+'" height="'+px+'" viewBox="0 0 64 64" aria-hidden="true">'+ICO3D[icoKind(name)].split('§').join(u)+'</svg>';
}
function sourcesHTML(s,e,ps,pe,ys,ye,lab){
  var cur=sourceTotals(s,e),prev=ps?sourceTotals(ps,pe):null,ytd=ys?sourceTotals(ys,ye):null;
  var ids=catsOf('income').map(function(c){return c.id});
  if(cur.map.none||(prev&&prev.map.none)||(ytd&&ytd.map.none))ids.push('none');
  if(!ids.length)return empty('Sin categorías de ingreso','Crea tus fuentes en Ajustes.');
  var z={i:0,e:0},ti=0,te=0;
  var rows=ids.map(function(k){var c=catById(k),a=cur.map[k]||z;ti+=a.i;te+=a.e;
    return {id:k,img:(c&&c.img)||'',name:c?c.name:'Sin categoría',color:c?c.color:'#9a9aa0',i:a.i,e:a.e,n:a.i-a.e,pi:prev?(prev.map[k]||z).i:0,py:ytd?(ytd.map[k]||z):z};
  }).sort(function(a,b){return b.n-a.n||b.i-a.i});
  var tools='<div class="srctools"><span class="note">Desliza para ver todas tus fuentes</span><span class="tools"><button class="btn icon sm" data-act="src-scroll" data-d="-1" aria-label="Fuentes anteriores">‹</button><button class="btn icon sm" data-act="src-scroll" data-d="1" aria-label="Más fuentes">›</button></span></div>';
  var h=tools+'<div class="srcslider" tabindex="0" role="region" aria-label="Fuentes de ingreso">'+rows.map(function(r){
    var share=ti?r.i/ti*100:0,sub=[];
    sub.push(ti?Math.round(share)+'% de tus ingresos':'Sin ingresos');
    if(prev)sub.push('Ingresos '+delta(r.i,r.pi,lab));
    if(ytd)sub.push('En el año: ingresos '+money(r.py.i)+', utilidad '+money(r.py.i-r.py.e));
    return '<div class="scard'+(r.i===0&&r.e===0?' src-zero':'')+'"><div class="scard-top"><span class="src-ico">'+(r.img?'<img class="ico-img" src="'+r.img+'" alt="">':ico3d(r.name,48))+(r.id!=='none'?'<button class="src-edit" data-act="src-img" data-id="'+r.id+'" aria-label="Cambiar imagen de '+esc(r.name)+'">'+icon('edit',12)+'</button>':'')+'</span><span class="sutil"><small>Utilidad</small><b class="num '+(r.n<0?'neg':'inc')+'">'+money(r.n)+'</b></span></div>'
      +'<b class="sname">'+esc(r.name)+'</b>'
      +'<div class="bar" style="margin:2px 0 4px"><i style="width:'+share+'%;background:'+r.color+'"></i></div>'
      +'<div class="srow src-detail"><span>Ingresos</span><b class="inc">'+money(r.i)+'</b></div><div class="srow src-detail"><span>Egresos</span><b class="exp">'+money(r.e)+'</b></div><div class="srow src-detail"><span>Margen</span><b>'+(r.i>0?Math.round(r.n/r.i*100)+'%':'—')+'</b></div>'
      +'<small class="src-detail note">'+sub.join(' · ')+'</small></div>';
  }).join('')+'</div>';
  if(!rows.some(function(r){return r.i||r.e}))h+='<p class="note src-so" style="margin:0">Aún no hay ingresos en este periodo.</p>';
  h+='<div class="kvs src-detail" style="margin-top:14px"><div><small>Ingresos totales</small><b class="inc">'+money(ti)+'</b></div><div><small>Egresos asignados</small><b class="exp">'+money(te)+'</b></div><div><small>Utilidad de fuentes</small><b class="'+(ti-te<0?'neg':'')+'">'+money(ti-te)+'</b></div></div>';
  h+='<p class="note src-detail" style="margin:10px 0 0">Egresos sin fuente asignada (gastos personales u otros): <b class="exp">'+money(cur.un)+'</b>. Al registrar un egreso puedes elegir a qué fuente pertenece.</p>';
  return h;
}
function spark(vals){
  var w=250,h=58,p=5,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1;
  var pts=vals.map(function(v,i){return [p+i*(w-2*p)/(vals.length-1),h-p-(v-mn)/rg*(h-2*p)]});
  var d=pts.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(''),last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" aria-label="Tendencia del patrimonio en 12 meses"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="'+d+'L'+(w-p)+' '+h+'L'+p+' '+h+'Z" fill="url(#sg)"/><path d="'+d+'" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="#fff" stroke="#0A0A0A" stroke-width="2"/></svg>';
}
function animateNumbers(){
  if(reduced)return;
  $$('[data-c]').forEach(function(el){
    var to=+el.dataset.c,t0=performance.now(),dur=750;
    requestAnimationFrame(function st(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=money(Math.round(to*e));if(k<1)requestAnimationFrame(st)});
  });
}

/* MOVIMIENTOS (lista con filtros) */
function filtered(kind){
  var q=F.q.trim().toLowerCase();
  var list=S.movements.filter(function(m){
    if(kind&&m.type!==kind)return false;
    if(!kind&&F.type!=='all'&&m.type!==F.type)return false;
    if(F.cat&&m.categoryId!==F.cat)return false;
    if(F.acc&&m.accountId!==F.acc&&m.toAccountId!==F.acc)return false;
    if(F.from&&m.date<F.from)return false;
    if(F.to&&m.date>F.to)return false;
    if(q&&(m.name+' '+(m.notes||'')+' '+catName(m.categoryId)).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var s=F.sort;
  list.sort(function(a,b){
    if(s==='amt-desc')return cents(b.amount)-cents(a.amount);
    if(s==='amt-asc')return cents(a.amount)-cents(b.amount);
    var d=a.date===b.date?(a.ts||0)-(b.ts||0):(a.date<b.date?-1:1);
    return s==='date-asc'?d:-d;
  });
  return list;
}
function rowHTML(m){
  var sign=m.type==='income'?'+':m.type==='expense'?'-':'',cl=m.type==='income'?'inc':m.type==='expense'?'exp':'';
  var sub=[m.kind?cap(m.kind):'',m.method||'',m.sourceId&&catById(m.sourceId)?'Fuente: '+catName(m.sourceId):'',m.notes||''].filter(Boolean).join(' · ');
  var cat=m.type==='transfer'?'<span class="chip">'+icon('swap',14)+' Transferencia</span>':chipCat(m.categoryId);
  var acc=m.type==='transfer'?esc(accName(m.accountId))+' → '+esc(accName(m.toAccountId)):esc(accName(m.accountId));
  return '<div class="mrow"><div class="dt num">'+fmtDate(m.date)+'</div><div class="d"><b>'+esc(m.name)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><div class="cat">'+cat+'</div><div class="acc">'+acc+'</div><div class="amt '+cl+'">'+sign+money(cents(m.amount))+'</div><div class="act"><button data-act="edit-mv" data-id="'+m.id+'" aria-label="Editar movimiento">'+icon('edit',16)+'</button><button data-act="del-mv" data-id="'+m.id+'" aria-label="Eliminar movimiento">'+icon('trash',16)+'</button></div></div>';

  h+='<div class="sec"><div class="tools"><div class="seg" role="group" aria-label="Periodo">'+[['week','Semana'],['month','Mes'],['quarter','Trimestre'],['year','Año']].map(function(k){return '<button data-act="rep-kind" data-k="'+k[0]+'" aria-pressed="'+(R.kind===k[0])+'">'+k[1]+'</button>'}).join('')+'</div></div><div class="tools"><button class="btn icon" data-act="rep-nav" data-d="-1" aria-label="Periodo anterior">‹</button><b style="min-width:150px;text-align:center;font-family:var(--display);font-style:italic;font-size:18px">'+d.r.label+'</b><button class="btn icon" data-act="rep-nav" data-d="1" aria-label="Periodo siguiente">›</button>'+(R.off?'<button class="btn sm" data-act="rep-nav" data-d="0">Actual</button>':'')+'</div>'+exportBar('report')+'</div>';

  h+='<div class="grid g4">'+kpi('Ingresos',money(d.cur.i),delta(d.cur.i,d.prev.i,lab),'inc')+kpi('Egresos',money(d.cur.e),delta(d.cur.e,d.prev.e,lab),'exp')+kpi('Balance',money(d.cur.n),'Anterior '+money(d.prev.n),d.cur.n<0?'neg':'')+kpi('Tasa de ahorro',pctTxt(d.cur.rate),'Anterior '+pctTxt(d.prev.rate),d.cur.rate!=null&&d.cur.rate<0?'neg':'')+'</div>';
  if(!d.cur.count)h+='<div class="empty"><strong>Sin movimientos en este periodo</strong>Cambia de periodo con las flechas o registra nuevos movimientos.</div>';
  h+='<div class="grid g2"><div class="card"><h2>Ingresos frente a egresos</h2><p class="sub">'+d.r.label+'</p>'+chartBox('rBars','Ingresos frente a egresos del periodo')+'</div><div class="card x-adv"><h2>Evolución del ahorro</h2><p class="sub">Balance acumulado dentro del periodo</p>'+chartBox('rSave','Evolución del ahorro acumulado')+'</div></div>';
  h+='<div class="grid g2"><div class="card"><h2>Gastos por categoría</h2><p class="sub">'+d.r.label+'</p>'+(cb.total?'<div class="split"><div class="chartbox"><canvas id="rCats" role="img" aria-label="Gastos por categoría"></canvas></div>'+legendHTML(cb.items,cb.total)+'</div>':empty('Sin egresos en este periodo'))+'</div>';
  var top=catBreakdown(d.r.s,d.r.e,99).items.slice(0,5);
  h+='<div class="card x-adv"><h2>Dónde más gastas</h2><p class="sub">Las 5 categorías principales</p>'+(top.length?'<div class="mini">'+top.map(function(x,i){return '<div class="it"><div><b>'+(i+1)+'. '+esc(x.name)+'</b><small>'+Math.round(x.c/d.cur.e*100)+'% de tus egresos</small></div><b class="num exp">'+money(x.c)+'</b></div>'}).join('')+'</div>':empty('Sin datos'))+'</div></div>';
  h+='<div class="card"><h2>Ingresos por fuente</h2><p class="sub">'+d.r.label+' frente al periodo anterior</p>'+sourcesHTML(d.r.s,d.r.e,d.p.s,d.p.e,null,null,'vs periodo anterior')+'</div>';
  var m6=monthsBack(6).map(function(r){return Object.assign({label:r.label},totalsC(r.s,r.e))});
  h+='<div class="card x-adv"><h2>Comparativa entre meses</h2><p class="sub">Balance mensual de los últimos 6 meses</p><div class="scroll"><table class="t"><thead><tr><th>Mes</th><th>Ingresos</th><th>Egresos</th><th>Balance</th><th>Ahorro</th><th>Egresos vs mes previo</th></tr></thead><tbody>'+m6.map(function(x,i){return '<tr><td>'+x.label+'</td><td class="inc">'+money(x.i)+'</td><td class="exp">'+money(x.e)+'</td><td class="'+(x.n<0?'neg':'')+'">'+money(x.n)+'</td><td>'+pctTxt(x.rate)+'</td><td>'+(i?delta(x.e,m6[i-1].e,''):'—')+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  var m12=monthsBack(12).map(function(r){return totalsC(r.s,r.e)});
  var act=m12.slice(-6).filter(function(x){return x.count>0});
  var trend='Registra al menos 3 meses con movimientos para ver tu tendencia.';
  if(act.length>=3){
    var ys=m12.slice(-6).map(function(x){return x.e/100}),n=ys.length,xm=(n-1)/2,ym=ys.reduce(function(a,b){return a+b},0)/n,num=0,den=0;
    ys.forEach(function(y,i){num+=(i-xm)*(y-ym);den+=(i-xm)*(i-xm)});
    var slope=den?num/den:0,rel=ym?slope/ym:0;
    trend=Math.abs(rel)<.02?'Tus egresos se mantienen estables en los últimos 6 meses.':'Tus egresos '+(rel>0?'suben':'bajan')+' en promedio '+Math.abs(Math.round(rel*100))+'% por mes en los últimos 6 meses.';
  }
  h+='<div class="card x-adv"><h2>Tendencias financieras</h2><p class="sub">'+trend+'</p>'+chartBox('rTrend','Tendencia de ingresos y egresos de 12 meses',true)+'</div></div>';
  return h;
};

  document.title='OG Finanzas · '+r[1];

  var sb=$('#simpleBtn');sb.setAttribute('aria-pressed',String(sm));sb.innerHTML=icon('simple',16)+'<span class="lg">'+(sm?'Vista simplificada':'Simplificado')+'</span>';sb.title=sm?'Volver a la vista completa':'Mostrar una vista más limpia';

  $('#newBtn').innerHTML=icon('plus',16)+'<span class="lg">Nuevo movimiento</span><span class="sh">Nuevo</span>';

  themeBtn();syncPill();lockBtn();
  var y=window.scrollY;

var draft=null;
function newDraft(type,accId){
  var accs=S.accounts,def=accId||(accById(S.settings.lastAccount)?S.settings.lastAccount:(accs[0]&&accs[0].id)||'');
  return {id:null,type:type||'expense',amount:'',name:'',date:today(),categoryId:'',accountId:def,toAccountId:'',method:'',kind:'variable',sourceId:'',notes:''};
}
function mvForm(){
  var sm=!!S.settings.simple,d=draft,isT=d.type==='transfer',isI=d.type==='income',editing=!!d.id;

    var cl=catsOf(d.type);
    h+='<div class="field"><label for="d-cat">Categoría</label><select class="select" id="d-cat" data-d="categoryId">'+opts(cl.map(function(c){return [c.id,c.name]}),d.categoryId,'Elige una categoría')+'</select>'+(d.addCat?'<div class="cq"><input class="input" id="d-newcat" placeholder="Nombre de la categoría" autocomplete="off" aria-label="Nueva categoría"><button type="button" class="btn sm primary" data-act="cat-quick-save">Agregar</button><button type="button" class="btn sm" data-act="cat-quick">Cancelar</button></div>':'<button type="button" class="btn sm" data-act="cat-quick" style="align-self:flex-start">'+icon('plus',14)+' Nueva categoría</button>')+'</div>';
    h+='<div class="field"><label for="d-acc">'+(isI?'Cuenta de recepción':'Cuenta utilizada')+'</label><select class="select" id="d-acc" data-d="accountId">'+opts(accOpts,d.accountId,'Elige una cuenta')+'</select></div>';
    if(!sm)h+='<div class="field"><label for="d-method">'+(isI?'Método de recepción':'Método de pago')+'</label><select class="select" id="d-method" data-d="method">'+opts((isI?METHODS_INC:METHODS_EXP).map(function(x){return [x,x]}),d.method,'Sin especificar')+'</select></div>';
    if(!sm)h+='<div class="field full"><label for="d-kind">'+(isI?'Tipo de ingreso':'Tipo de gasto')+'</label><select class="select" id="d-kind" data-d="kind">'+opts((isI?[['fijo','Fijo'],['variable','Variable'],['extraordinario','Extraordinario']]:[['fijo','Fijo'],['variable','Variable']]),d.kind)+'</select></div>';
    if(!isI)h+='<div class="field full"><label for="d-src">Fuente de ingreso relacionada (opcional)</label><select class="select" id="d-src" data-d="sourceId">'+opts(catsOf('income').map(function(c){return [c.id,c.name]}),d.sourceId,'Ninguna (gasto personal)')+'</select></div>';
  }else{
    h+='<div class="field"><label for="d-acc">Desde</label><select class="select" id="d-acc" data-d="accountId">'+opts(accOpts,d.accountId,'Elige cuenta de origen')+'</select></div>';
    h+='<div class="field"><label for="d-to">Hacia</label><select class="select" id="d-to" data-d="toAccountId">'+opts(accOpts,d.toAccountId,'Elige cuenta de destino')+'</select></div>';
    h+='<p class="note full" style="margin:0">Las transferencias entre tus cuentas no cuentan como ingreso ni egreso.</p>';
  }
  h+=(sm?'':'<div class="field full"><label for="d-notes">Notas (opcional)</label><textarea class="input" id="d-notes" data-d="notes" rows="2">'+esc(d.notes)+'</textarea></div>')+'</div>';

function openMv(type,id,accId){
  if(id){var m=S.movements.find(function(x){return x.id===id});if(!m)return;draft=Object.assign({},m,{amount:String(m.amount),notes:m.notes||'',method:m.method||'',kind:m.kind||'variable',sourceId:m.sourceId||'',categoryId:m.categoryId||'',toAccountId:m.toAccountId||''});}
  else draft=newDraft(type,accId);
  draft.addCat=false;
  if(!S.accounts.length){toast('Primero crea una cuenta');openAcc();return}
  openModal(id?'Editar movimiento':'Nuevo movimiento',mvForm());
}
function rerenderMv(){var mb=$('#modalRoot .mb');if(mb){mb.innerHTML=mvForm();var f=draft.addCat?$('#d-newcat'):$('#d-amount');if(f)f.focus()}}
function saveMv(again){
  var d=draft,err=function(t){$('#fErr').textContent=t;return false};
  var amt=parseAmt(d.amount);
  if(!(amt>0))return err('Escribe un monto mayor a cero.');
  if(!d.date)return err('Elige la fecha.');
  if(!d.accountId||!accById(d.accountId))return err(d.type==='transfer'?'Elige la cuenta de origen.':'Elige una cuenta.');
  var rec={id:d.id||uid(),type:d.type,name:(d.name||'').trim(),amount:amt,date:d.date,accountId:d.accountId,notes:(d.notes||'').trim(),ts:d.ts||Date.now()};
  if(d.type==='transfer'){
    if(!d.toAccountId||!accById(d.toAccountId))return err('Elige la cuenta de destino.');
    if(d.toAccountId===d.accountId)return err('El origen y el destino deben ser cuentas distintas.');
    rec.toAccountId=d.toAccountId;if(!rec.name)rec.name='Transferencia a '+accName(d.toAccountId);
  }else{
    if(!d.categoryId)return err('Elige una categoría. Puedes crear nuevas en Ajustes.');
    rec.categoryId=d.categoryId;rec.method=d.method||'';rec.kind=d.kind||'variable';
    rec.sourceId=(d.type==='expense'&&catById(d.sourceId))?d.sourceId:'';
    if(!rec.name)rec.name=catName(d.categoryId);
  }
  var i=S.movements.findIndex(function(x){return x.id===rec.id});
  if(i>=0)S.movements[i]=rec;else S.movements.push(rec);
  S.settings.lastAccount=rec.accountId;
  commit();
  if(again){draft=newDraft(d.type,d.accountId);draft.date=d.date;draft.categoryId=d.categoryId;draft.sourceId=d.sourceId;rerenderMv();toast('Guardado. Puedes capturar otro.')}
  else{closeModal();toast('Movimiento guardado')}
  return true;
}

var imgTarget=null;
function openImg(id){
  var c=catById(id);if(!c)return;imgTarget=id;
  openModal('Imagen de «'+c.name+'»','<div style="display:flex;gap:16px;align-items:center"><span class="src-ico" style="width:96px;height:96px;border-radius:24px">'+(c.img?'<img class="ico-img" style="border-radius:22px" src="'+c.img+'" alt="">':ico3d(c.name,76))+'</span><p class="note" style="margin:0">Elige una foto de tu galería. Se recorta en cuadro y se guarda junto con tus datos.</p></div><input type="file" id="imgFile" accept="image/*" hidden><div class="err" id="fErr" role="alert"></div><div class="mf">'+(c.img?'<button class="btn danger" data-act="img-remove">Quitar imagen</button>':'')+'<label class="btn primary" for="imgFile" style="cursor:pointer">'+icon('upload',16)+' Elegir de la galería</label></div>');
}
function handleImg(file){
  var err=function(t){var e=$('#fErr');if(e)e.textContent=t};
  if(!file||!/^image\//.test(file.type)){err('Elige un archivo de imagen.');return}
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    try{
      var N=176,cv=document.createElement('canvas');cv.width=N;cv.height=N;
      var w=im.naturalWidth,h=im.naturalHeight,sw=Math.min(w,h),sx=(w-sw)/2,sy=(h-sw)/2,x=cv.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,N,N);x.drawImage(im,sx,sy,sw,sw,0,0,N,N);
      var data=cv.toDataURL('image/jpeg',0.84),c=catById(imgTarget);
      URL.revokeObjectURL(url);
      if(!c){closeModal();return}
      c.img=data;commit();closeModal();toast('Imagen guardada');
    }catch(e){err('No se pudo procesar la imagen.')}
  };
  im.onerror=function(){URL.revokeObjectURL(url);err('No se pudo leer la imagen. Prueba con un archivo JPG o PNG.')};
  im.src=url;
}
function openCats(kind){
  openModal('Categorías','<div class="seg" role="group" aria-label="Tipo de categoría" style="align-self:flex-start"><button data-act="cat-kind" data-kind="income" aria-pressed="'+(kind==='income')+'">Ingresos</button><button data-act="cat-kind" data-kind="expense" aria-pressed="'+(kind==='expense')+'">Egresos</button></div><div class="stack" style="gap:10px" id="catList" data-kind="'+kind+'">'+catRows(kind)+'</div><form data-form="cat" data-kind="'+kind+'" class="cadd" novalidate><input type="color" id="n-color" value="'+PALETA[catsOf(kind).length%PALETA.length]+'" aria-label="Color"><input class="input" id="n-name" placeholder="Nueva categoría de '+(kind==='income'?'ingreso':'egreso')+'" autocomplete="off" aria-label="Nombre de la nueva categoría"><button class="btn primary" type="submit">'+icon('plus',15)+' Agregar</button></form><div class="err" id="fErr" role="alert"></div>',true);
}

/* ---------- exportación ---------- */
function getDownloads(){try{if(window.claude&&window.claude.use)return Promise.resolve(window.claude.use('downloads'))}catch(e){}return Promise.resolve(null)}
function localSave(name,data){
  try{
    var ext=name.split('.').pop(),type={xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pdf:'application/pdf',json:'application/json'}[ext]||'application/octet-stream';
    var blob=new Blob([data],{type:type}),file=null;
    try{file=new File([blob],name,{type:type})}catch(e){}
    var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
    if(standalone&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).then(function(){toast('Archivo listo')},function(e){if(e&&e.name==='AbortError')return;anchorSave(blob,name)});return;
    }
    anchorSave(blob,name);
  }catch(e){toast('No se pudo guardar el archivo')}
}
function anchorSave(blob,name){
  var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Archivo descargado');
}
function saveFile(name,data){
  return getDownloads().then(function(dl){
    if(!dl||!dl.save){localSave(name,data);return}
    return dl.save({filename:name,data:data}).then(function(){toast('Archivo guardado')},function(e){if(e&&e.code==='declined')return;toast('No se pudo guardar el archivo')});
  });
}
function mvExportRows(list){
  return list.map(function(m){var v=cents(m.amount)/100;return {'Fecha':m.date,'Tipo':typeName(m.type),'Descripción':m.name,'Categoría':m.type==='transfer'?'Transferencia':catName(m.categoryId),'Cuenta':accName(m.accountId),'Cuenta destino':m.type==='transfer'?accName(m.toAccountId):'','Método':m.method||'','Clase':m.kind?cap(m.kind):'','Fuente de ingreso':m.type==='income'?catName(m.categoryId):(m.type==='expense'&&m.sourceId?catName(m.sourceId):''),'Monto':v,'Efecto en balance':m.type==='income'?v:m.type==='expense'?-v:0,'Notas':m.notes||''}});
}
function addSheet(wb,name,rows,moneyCols){
  var ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Sin datos':''}]);
  var keys=Object.keys(rows[0]||{'Sin datos':''});
  ws['!cols']=keys.map(function(k){return {wch:Math.max(12,Math.min(38,k.length+6))}});
  if(rows.length)rows.forEach(function(r,ri){keys.forEach(function(k,ci){if(moneyCols.indexOf(k)>=0){var ref=XLSX.utils.encode_cell({r:ri+1,c:ci});if(ws[ref])ws[ref].z='"$"#,##0.00'}})});
  XLSX.utils.book_append_sheet(wb,ws,name);
}
function scopeData(scope){
  if(scope==='report'){var d=repData();var list=S.movements.filter(function(m){return m.date>=d.r.s&&m.date<=d.r.e}).sort(function(a,b){return a.date<b.date?-1:1});return {list:list,title:'Reporte '+d.r.label,range:d.r,d:d}}
  return {list:filtered(curKind()),title:'Movimientos',range:null};
}
function srcMap(list){
  var map={};
  list.forEach(function(m){
    var k,f;
    if(m.type==='income'){k=catName(m.categoryId);f='i'}
    else if(m.type==='expense'){k=m.sourceId&&catById(m.sourceId)?catName(m.sourceId):'Sin fuente asignada';f='e'}
    else return;
    (map[k]=map[k]||{i:0,e:0})[f]+=cents(m.amount);
  });
  return map;
}
function exportXlsx(scope){
  if(!window.XLSX){toast('No se pudo cargar el módulo de Excel');return}
  var sd=scopeData(scope),wb=XLSX.utils.book_new(),i=0,e=0;
  sd.list.forEach(function(m){if(m.type==='income')i+=cents(m.amount);else if(m.type==='expense')e+=cents(m.amount)});
  addSheet(wb,'Resumen',[{'Concepto':'Ingresos','Monto':i/100},{'Concepto':'Egresos','Monto':e/100},{'Concepto':'Balance','Monto':(i-e)/100},{'Concepto':'Tasa de ahorro','Monto':i>0?Math.round((i-e)/i*1000)/10+'%':'—'}].map(function(r){return Object.assign({'Periodo':sd.range?sd.range.label:'Selección actual'},r)}),['Monto']);
  var map={};sd.list.forEach(function(m){if(m.type!=='expense')return;var k=catName(m.categoryId);map[k]=(map[k]||0)+cents(m.amount)});
  var smap=srcMap(sd.list);
  addSheet(wb,'Ingresos por fuente',Object.keys(smap).sort(function(x,y){return (smap[y].i-smap[y].e)-(smap[x].i-smap[x].e)}).map(function(k){var q=smap[k];return {'Fuente':k,'Ingresos':q.i/100,'Egresos':q.e/100,'Utilidad':(q.i-q.e)/100,'Margen %':q.i>0?Math.round((q.i-q.e)/q.i*1000)/10:0}}),['Ingresos','Egresos','Utilidad']);
  addSheet(wb,'Egresos por categoría',Object.keys(map).sort(function(a,b){return map[b]-map[a]}).map(function(k){return {'Categoría':k,'Monto':map[k]/100,'% del total':e?Math.round(map[k]/e*1000)/10:0}}),['Monto']);
  if(sd.d)addSheet(wb,'Por subperiodo',sd.d.bks.map(function(b){return {'Periodo':b.label,'Ingresos':b.i/100,'Egresos':b.e2/100,'Balance':b.n/100}}),['Ingresos','Egresos','Balance']);
  addSheet(wb,'Movimientos',mvExportRows(sd.list),['Monto','Efecto en balance']);
  addSheet(wb,'Cuentas',S.accounts.map(function(a){return {'Cuenta':a.name,'Tipo':a.type,'Saldo actual':accountBalanceC(a)/100}}),['Saldo actual']);
  var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  saveFile('OG-finanzas-'+(sd.range?sd.range.label.replace(/\s+/g,'-'):'movimientos')+'-'+today()+'.xlsx',out);
}
var pdfTxt=function(s){return String(s==null?'':s).replace(/[  ]/g,' ').replace(/[→]/g,'>').replace(/[–—−]/g,'-')};
function exportPdf(scope){
  if(!window.jspdf){toast('No se pudo cargar el módulo de PDF');return}
  var sd=scopeData(scope),doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'}),W=doc.internal.pageSize.getWidth();
  if(typeof doc.autoTable!=='function'){toast('No se pudo cargar el módulo de tablas PDF');return}
  var i=0,e=0;sd.list.forEach(function(m){if(m.type==='income')i+=cents(m.amount);else if(m.type==='expense')e+=cents(m.amount)});
  doc.setFillColor(10,10,10);doc.rect(0,0,W,74,'F');
  try{doc.addImage(LOGO,'PNG',36,20,110,Math.round(110*192/560))}catch(x){}
  doc.setTextColor(255,255,255);doc.setFontSize(14);doc.text(pdfTxt(sd.title),W-36,36,{align:'right'});
  doc.setFontSize(9);doc.setTextColor(180,180,180);doc.text('Generado el '+fmtDate(today())+' · '+S.settings.currency,W-36,54,{align:'right'});
  doc.setTextColor(10,10,10);
  doc.autoTable({startY:96,head:[['Ingresos','Egresos','Balance','Tasa de ahorro']],body:[[pdfTxt(money(i)),pdfTxt(money(e)),pdfTxt(money(i-e)),i>0?Math.round((i-e)/i*100)+'%':'-']],theme:'grid',headStyles:{fillColor:[10,10,10]},styles:{fontSize:10,halign:'center'}});
  var smap=srcMap(sd.list);
  var ir=Object.keys(smap).sort(function(x,y){return (smap[y].i-smap[y].e)-(smap[x].i-smap[x].e)}).map(function(k){var q=smap[k];return [pdfTxt(k),pdfTxt(money(q.i)),pdfTxt(money(q.e)),pdfTxt(money(q.i-q.e)),q.i>0?Math.round((q.i-q.e)/q.i*100)+'%':'-']});
  if(ir.length)doc.autoTable({startY:doc.lastAutoTable.finalY+18,head:[['Fuente de ingreso','Ingresos','Egresos','Utilidad','Margen']],body:ir,theme:'striped',headStyles:{fillColor:[10,10,10]},styles:{fontSize:9},columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});
  var map={};sd.list.forEach(function(m){if(m.type!=='expense')return;var k=catName(m.categoryId);map[k]=(map[k]||0)+cents(m.amount)});
  var cr=Object.keys(map).sort(function(a,b){return map[b]-map[a]}).map(function(k){return [pdfTxt(k),pdfTxt(money(map[k])),(e?Math.round(map[k]/e*100):0)+'%']});
  if(cr.length)doc.autoTable({startY:doc.lastAutoTable.finalY+18,head:[['Egresos por categoría','Monto','%']],body:cr,theme:'striped',headStyles:{fillColor:[10,10,10]},styles:{fontSize:9},columnStyles:{1:{halign:'right'},2:{halign:'right'}}});
  doc.autoTable({startY:doc.lastAutoTable.finalY+18,head:[['Fecha','Tipo','Descripción','Categoría','Cuenta','Monto']],body:sd.list.map(function(m){return [m.date,typeName(m.type),pdfTxt(m.name),m.type==='transfer'?'Transferencia':pdfTxt(catName(m.categoryId)),pdfTxt(m.type==='transfer'?accName(m.accountId)+' > '+accName(m.toAccountId):accName(m.accountId)),pdfTxt((m.type==='expense'?'-':m.type==='income'?'+':'')+money(cents(m.amount)))]}),theme:'striped',headStyles:{fillColor:[10,10,10]},styles:{fontSize:8},columnStyles:{5:{halign:'right'}}});
  saveFile('OG-finanzas-'+(sd.range?sd.range.label.replace(/\s+/g,'-'):'movimientos')+'-'+today()+'.pdf',doc.output('arraybuffer'));
}
function backupJSON(){return JSON.stringify({app:'og-finanzas',exported:new Date().toISOString(),data:S},null,2)}
function restoreFrom(text){
  var o;try{o=JSON.parse(text)}catch(e){toast('El archivo no es un respaldo válido');return}
  var d=o&&o.data?o.data:o;
  if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.movements)||!Array.isArray(d.categories)){toast('El archivo no parece un respaldo de OG Finanzas');return}
  confirmBox('Restaurar respaldo','Se reemplazará tu información actual por el respaldo ('+d.movements.length+' movimientos, '+d.accounts.length+' cuentas). Esta acción no se puede deshacer.','Restaurar',true).then(function(ok){
    if(!ok)return;S=normalize(d);setFmt();applyTheme();commit();toast('Respaldo restaurado');
  });
}

var PLAYBOOK=[
 [/nutric|entren|paciente|coach/i,['Ofrece planes de seguimiento mensual con renovación en lugar de consultas sueltas.','Escribe esta semana a pacientes o clientes que llevan más de 30 días sin volver.','Pide referidos con un beneficio concreto (una valoración o sesión de cortesía).']],
 [/salario|sueldo|nómina|nomina/i,['Un salario cambia poco por sí solo: el margen está en sumar clientes personalizados o grupos aparte de tu horario base.','Evalúa pedir más horas, un grupo extra o un ajuste en tu pago con los resultados que has logrado.']],
 [/masaj/i,['Ofrece paquetes de 4 sesiones con precio ligeramente menor y fecha de vencimiento.','Ofréceselo a tus clientes de entrenamiento como complemento de recuperación.','Reserva horarios fijos y manda recordatorio por WhatsApp para reducir huecos y cancelaciones.']],
 [/suplement/i,['Véndelos junto con tu plan nutricional: es la venta cruzada más natural.','Revisa tu precio de compra frente al de venta; un margen bajo hace que vender más no rinda.','Ofrece reposición mensual a quien ya los usa.']],
 [/c[aá]rnic|carne/i,['Trabaja con pedidos programados (semanales o quincenales) y preventa para saber cuánto comprar.','Revisa el costo por kilo y tu precio: confirma que cada corte deja margen.','Reactiva a tus clientes recurrentes con un mensaje antes del fin de semana.']],
 [/ropa|prenda|vest/i,['Haz lanzamientos pequeños por temporada con preventa para no inmovilizar inventario.','Rota lo que no se vende con promociones por tiempo limitado.','Muestra la ropa en uso (clientes, entrenamientos) en tus redes y enlaza directo a pedir.']],
 [/jugo|fruta|bolsa/i,['Ofrece suscripción semanal o combos por volumen para asegurar pedidos recurrentes.','Revisa merma y costo de la fruta; ajustar porciones o precio puede mejorar el margen sin vender más.','Agrupa entregas por zona o día para bajar costos de reparto.']]
];
function advTips(name){for(var i=0;i<PLAYBOOK.length;i++)if(PLAYBOOK[i][0].test(name))return PLAYBOOK[i][1];return ['Define una meta mensual para esta fuente y revisa cada semana cuánto llevas.','Identifica a tus mejores clientes en ella y piensa qué más podrías ofrecerles.','Mide cuánto dinero y tiempo le dedicas; prioriza la que deja más por hora.']}
function advisorData(){
  var t=today(),td=parseD(t),dom=td.getDate(),dim=new Date(td.getFullYear(),td.getMonth()+1,0).getDate();
  var rg=[rangeOf('month',-1),rangeOf('month',-2),rangeOf('month',-3)],rm=rangeOf('month',0),d30=addDays(t,-30),d120=addDays(t,-120);
  var first=S.movements.reduce(function(a,m){return !a||m.date<a?m.date:a},'');
  var n=0;if(first){rg.forEach(function(r){if(r.e>=first)n++})}
  var P={};
  function g(k){return P[k]||(P[k]={m:[0,0,0],mtd:0,mtdE:0,e3:0,last:'',l30:0,prior:0,cnt:0,sum:0,exp:{}})}
  S.movements.forEach(function(m){
    if(m.date>t)return;
    var v=cents(m.amount),i,k;
    if(m.type==='income'){
      k=m.categoryId||'none';var p=g(k);
      if(!p.last||m.date>p.last)p.last=m.date;
      if(m.date>d30)p.l30+=v;else if(m.date>d120)p.prior+=v;
      for(i=0;i<3;i++)if(m.date>=rg[i].s&&m.date<=rg[i].e){p.m[i]+=v;p.cnt++;p.sum+=v}
      if(m.date>=rm.s&&m.date<=rm.e){p.mtd+=v;p.cnt++;p.sum+=v}
    }else if(m.type==='expense'&&m.sourceId){
      var q=g(m.sourceId),inW=false;
      for(i=0;i<3;i++)if(m.date>=rg[i].s&&m.date<=rg[i].e)inW=true;
      if(inW)q.e3+=v;
      if(m.date>=rm.s&&m.date<=rm.e)q.mtdE+=v;
      if(inW||(m.date>=rm.s&&m.date<=rm.e)){var cn=m.categoryId?catName(m.categoryId):'Sin categoría';q.exp[cn]=(q.exp[cn]||0)+v}
    }
  });
  var totI=0;
  var rows=catsOf('income').map(function(c){
    var p=P[c.id]||g(c.id),ms=p.m.slice(0,n),sum3=ms.reduce(function(a,b){return a+b},0);
    var I=sum3+p.mtd,E=p.e3+p.mtdE;totI+=I;
    return {c:c,p:p,n:n,avg:n?sum3/n:0,I:I,E:E};
  });
  rows.forEach(function(r){
    var p=r.p,c=r.c,issues=[],tips=[],lvl=0,share=totI?r.I/totI:0,goal=c.goal>0?Math.round(c.goal*100):0;
    function add(sv,txt){issues.push(txt);if(sv>lvl)lvl=sv}
    r.share=share;r.goal=goal;
    if(!p.last){r.status='nodata';r.diag='Aún no registras ingresos en esta fuente.';r.tips=['Registra tus ingresos de esta fuente (con su categoría) para que pueda analizarla.','Si ya no la usas, puedes eliminarla o dejarla sin movimiento.'];r.lvl=-1;return}
    if(goal){
      if(n&&r.avg<goal*.9)add(2,'Promedias '+money(r.avg)+' al mes y tu meta es '+money(goal)+' (faltan '+money(goal-r.avg)+').');
      else if(dom>=10&&p.mtd<goal*dom/dim*.7)add(1,'Este mes llevas '+money(p.mtd)+' de tu meta de '+money(goal)+'; al ritmo actual cerrarías cerca de '+money(Math.round(p.mtd/dom*dim))+'.');
      if(n&&r.avg<goal*.9&&p.cnt>0){var tk=p.sum/p.cnt;if(tk>0)tips.push('Te faltan ≈'+money(goal-r.avg)+' al mes: con tu ingreso promedio por venta ('+money(Math.round(tk))+') '+(function(q){return q===1?'es ≈1 venta o sesión más.':'son ≈'+q+' ventas o sesiones más.'})(Math.max(1,Math.ceil((goal-r.avg)/tk))))}
    }
    if(n>=2){
      var base=p.m.slice(1,n).reduce(function(a,b){return a+b},0)/(n-1);
      if(base>0&&p.m[0]<base*.75){var dp=Math.round((1-p.m[0]/base)*100);add(p.m[0]<base*.5?2:1,'El mes pasado bajó '+dp+'% frente a su promedio anterior ('+money(p.m[0])+' vs '+money(Math.round(base))+').');tips.push('Revisa qué cambió el mes pasado en esta fuente (clientes que dejaron de comprar, horarios, precios) y repítelo en lo que funcionó antes.')}
    }
    if(p.l30===0&&p.prior>0){add(2,'No registras ingresos en los últimos 30 días (el último fue el '+fmtShort(p.last)+').');tips.push('Retoma contacto esta semana con los clientes o compradores anteriores de esta fuente.')}
    if(r.I>0&&r.E>0){
      var mg=(r.I-r.E)/r.I;
      if(mg<.3){
        var top=Object.keys(p.exp).sort(function(a,b){return p.exp[b]-p.exp[a]})[0];
        add(mg<0?2:1,'Sus egresos asignados se llevan el '+Math.round(r.E/r.I*100)+'% de lo que ingresa (margen '+Math.round(mg*100)+'%).');
        tips.push('Tu mayor egreso en esta fuente es «'+top+'» ('+money(p.exp[top])+'): revisa si puedes negociarlo, reducirlo o subir tu precio.');
      }
    }
    if(rows.length>1&&totI>0&&r.I>0&&share<.05)add(1,'Aporta solo el '+Math.round(share*100)+'% de tus ingresos.');
    r.lvl=lvl;r.status=lvl===2?'weak':lvl===1?'attn':'ok';
    r.diag=issues.length?issues[0]:(n?'Va bien: promedia '+money(r.avg)+' al mes'+(goal?' y alcanza tu meta.':'.'):'Todavía hay pocos meses de datos; este mes lleva '+money(p.mtd)+'.');
    r.issues=issues;
    r.tips=tips.concat(advTips(c.name)).slice(0,lvl?5:2);
  });
  rows.sort(function(a,b){return b.lvl-a.lvl||b.I-a.I});
  var top1=rows.slice().sort(function(a,b){return b.I-a.I})[0];
  return {rows:rows,n:n,totI:totI,conc:(top1&&totI>0&&top1.share>.6&&rows.filter(function(r){return r.I>0}).length>1)?top1:null};
}

var RULE_NEED=/vivienda|renta|alquiler|hipoteca|aliment|despensa|super|transporte|gasolina|servicio|luz|agua|gas\b|internet|tel[eé]fono|salud|m[eé]dic|educaci|colegiatura|deuda|pr[eé]stamo|cr[eé]dito|impuesto|seguro|negocio/i;
var ruleOff=0,ruleOpen=false;
function bucketOf(id){
  var c=catById(id);
  if(!c)return 'want';
  if(c.bucket==='need'||c.bucket==='want')return c.bucket;
  return RULE_NEED.test(c.name)?'need':'want';
}
function ruleData(off){
  var r=rangeOf('month',off),I=0,need=0,want=0,cn={},cw={};
  S.movements.forEach(function(m){
    if(m.date<r.s||m.date>r.e)return;
    var v=cents(m.amount);
    if(m.type==='income')I+=v;
    else if(m.type==='expense'){
      var b=bucketOf(m.categoryId),k=m.categoryId||'none';
      if(b==='need'){need+=v;cn[k]=(cn[k]||0)+v}else{want+=v;cw[k]=(cw[k]||0)+v}
    }
  });
  return {r:r,I:I,need:need,want:want,save:I-need-want,cn:cn,cw:cw};
}

  var all=Object.keys(d.cn).concat(Object.keys(d.cw));
  var cl=catsOf('expense');
  h+='<details class="advrow lvl-0"'+(ruleOpen?' open':'')+' style="border-left-width:1px"><summary><span class="at"><b>Ajustar clasificación de categorías</b><small>Decide qué categorías cuentan como necesidad y cuáles como gasto personal.</small></span></summary><div class="advbody">'+cl.map(function(c){var b=bucketOf(c.id);return '<div class="rcat"><span>'+esc(c.name)+'</span><select class="select" data-bucket="'+c.id+'" aria-label="Clasificación de '+esc(c.name)+'"><option value="need"'+(b==='need'?' selected':'')+'>Necesidad</option><option value="want"'+(b==='want'?' selected':'')+'>Personal</option></select></div>'}).join('')+'</div></details>';
  h+='<p class="note" style="margin:10px 0 0">Ahorro e inversión = ingresos del mes menos lo gastado. Las transferencias entre tus cuentas no cuentan como ingreso ni como gasto. Es una guía de referencia, no asesoría financiera profesional.</p></div>';
  return h;
}
Object.assign(acts,{'rule-nav':function(el){ruleOff=Math.min(0,ruleOff+(+el.dataset.d));ruleOpen=false;render()}});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.bucket){var c=catById(t.dataset.bucket);if(c){c.bucket=t.value;ruleOpen=true;commit()}}
});

/* ---------- PIN ---------- */
var pinShow=false,PINKEY='og-finanzas-pin',pinCfg=null,pbuf='',pfails=0,plockUntil=0,hiddenAt=0,ptimer=null;
function loadPin(){try{pinCfg=JSON.parse(localStorage.getItem(PINKEY)||'null')}catch(e){pinCfg=null}if(pinCfg&&(!pinCfg.h||!pinCfg.salt))pinCfg=null}
function sha(t){
  if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('')});
  var h=5381,i;for(i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return Promise.resolve('x'+(h>>>0).toString(16));
}
function rnd(n,alpha){var out='',i,a=new Uint32Array(n);try{crypto.getRandomValues(a)}catch(e){for(i=0;i<n;i++)a[i]=Math.floor(Math.random()*4294967295)}for(i=0;i<n;i++)out+=alpha.charAt(a[i]%alpha.length);return out}
function normRec(t){return String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function lockBtn(){var b=$('#lockBtn');if(!b)return;b.hidden=!pinCfg;b.innerHTML=icon('lock',16)+'<span>Bloquear</span>'}
function logo3d(){return '<img src="'+$('.brand img').src+'" alt="OG">'}
function drawLock(msg,bad){
  var L=$('#lock'),off=plockUntil>Date.now();
  L.hidden=false;
  L.innerHTML='<div class="lk">'+logo3d()+'<div class="welc"><small>Bienvenido a tu panel</small><b>Oscar</b></div><div class="pinwrap"><input class="pinbar" id="pinBar" type="'+(pinShow?'text':'password')+'" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••" aria-label="Ingresa tu PIN"'+(off?' disabled':'')+'><button type="button" class="pineye" data-act="pin-eye" aria-pressed="'+pinShow+'" aria-label="'+(pinShow?'Ocultar PIN':'Mostrar PIN')+'">'+'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'+'</button></div><p class="lkt'+(bad?' bad':'')+'" id="lkt">'+esc(msg||'Ingresa tu PIN')+'</p><button type="button" class="lkf" data-act="pin-forgot">Olvidé mi PIN</button></div>';
  var i=$('#pinBar');if(i&&!off)setTimeout(function(){try{i.focus()}catch(e){}},30);
}
function showLock(){
  if(!pinCfg)return;
  closeModal();pbuf='';
  document.body.classList.add('locked');
  drawLock('Ingresa tu PIN');
}
function unlock(){try{toast('Bienvenido a tu panel, Oscar')}catch(e){}
  document.body.classList.remove('locked');
  var L=$('#lock');L.hidden=true;L.innerHTML='';pbuf='';pfails=0;plockUntil=0;clearInterval(ptimer);
}
function pinFail(){
  pfails++;pbuf='';
  var left=5-pfails;
  if(left<=0){
    plockUntil=Date.now()+30000;pfails=0;
    var tick=function(){
      var sec=Math.ceil((plockUntil-Date.now())/1000);
      if(sec<=0){clearInterval(ptimer);plockUntil=0;drawLock('Ingresa tu PIN');return}
      drawLock('Demasiados intentos. Espera '+sec+' s',true);
    };
    clearInterval(ptimer);tick();ptimer=setInterval(tick,1000);return;
  }
  drawLock('PIN incorrecto · '+left+(left===1?' intento':' intentos'),true);
  var d=$('#pinBar');if(d)d.classList.add('shake');
}
function pinCheck(typed){
  if(!pinCfg||plockUntil>Date.now())return;
  sha(pinCfg.salt+':'+typed).then(function(h){if(h===pinCfg.h)unlock();else pinFail()});
}
function forgotUI(msg,bad){
  var L=$('#lock');
  L.innerHTML='<div class="lk">'+logo3d()+'<p class="lkt'+(bad?' bad':'')+'">'+esc(msg||'Código de recuperación')+'</p><p style="color:rgba(255,255,255,.65);font-size:14px;margin:0 0 16px">Escribe el código que se te mostró al activar el PIN.</p><input class="lkin" id="recIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" aria-label="Código de recuperación"><button type="button" class="lkb" data-act="pin-recover">Restablecer acceso</button><button type="button" class="lkf" data-act="pin-back-lock">Volver</button></div>';
  setTimeout(function(){var i=$('#recIn');if(i)i.focus()},30);
}
function pinForm(mode){
  var h='<div class="fgrid">';
  if(mode==='change'||mode==='remove')h+='<div class="field full"><label for="pin0">PIN actual</label><input class="input pinin" id="pin0" type="password" inputmode="numeric" maxlength="4" autocomplete="off" autofocus></div>';
  if(mode!=='remove')h+='<div class="field"><label for="pin1">'+(mode==='change'?'PIN nuevo':'Elige un PIN de 4 dígitos')+'</label><input class="input pinin" id="pin1" type="password" inputmode="numeric" maxlength="4" autocomplete="off"'+(mode==='new'?' autofocus':'')+'></div><div class="field"><label for="pin2">Repite el PIN</label><input class="input pinin" id="pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>';
  h+='</div><button type="button" class="btn sm" data-act="pin-eye2" aria-pressed="false" style="margin-top:10px">Mostrar PIN</button><p class="err" id="pinErr" role="alert" style="color:var(--exp);margin:10px 0 0;min-height:18px;font-size:13px"></p><div class="mf"><button class="btn" data-act="close">Cancelar</button><button class="btn '+(mode==='remove'?'danger':'primary')+'" data-act="pin-'+mode+'-do">'+(mode==='remove'?'Quitar PIN':'Guardar')+'</button></div>';
  openModal(mode==='new'?'Activar PIN':mode==='change'?'Cambiar PIN':'Quitar PIN',h);
}
function pinErr(m){var e=$('#pinErr');if(e)e.textContent=m}
function onlyDigits(el){el.value=el.value.replace(/\D/g,'').slice(0,4)}
function checkCurrent(){
  var v=($('#pin0')||{}).value||'';
  return sha(pinCfg.salt+':'+v).then(function(h){return h===pinCfg.h});
}
function savePin(mode){
  var a=($('#pin1')||{}).value||'',b=($('#pin2')||{}).value||'';
  if(!/^\d{4}$/.test(a))return pinErr('El PIN debe tener exactamente 4 números.');
  if(a!==b)return pinErr('Los dos PIN no coinciden.');
  var go=function(){
    var salt=rnd(16,'abcdef0123456789'),rec=mode==='new'?rnd(8,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'):null;
    Promise.all([sha(salt+':'+a),rec?sha(salt+':'+rec):Promise.resolve(pinCfg.rh)]).then(function(r){
      pinCfg={salt:salt,h:r[0],rh:r[1]};
      try{localStorage.setItem(PINKEY,JSON.stringify(pinCfg))}catch(e){return pinErr('No se pudo guardar el PIN en este navegador.')}
      closeModal();render();
      if(rec)openModal('Guarda tu código de recuperación','<p style="margin:0;color:var(--ink-2)">Si olvidas tu PIN, este código es la única forma de volver a entrar. Anótalo en un lugar seguro: no se vuelve a mostrar.</p><div class="reccode">'+rec.slice(0,4)+'-'+rec.slice(4)+'</div><div class="mf"><button class="btn primary" data-act="close">Ya lo guardé</button></div>');
      else toast('PIN actualizado');
    });
  };
  if(mode==='change')checkCurrent().then(function(ok){if(!ok)return pinErr('El PIN actual no es correcto.');go()});else go();
}
Object.assign(acts,{
 lock:function(){showLock()},
 'pin-eye':function(){var i=$('#pinBar'),v=i?i.value:'';pinShow=!pinShow;if(i){i.type=pinShow?'text':'password';i.focus();i.value=v}var b=$('.pineye');if(b){b.setAttribute('aria-pressed',pinShow);b.setAttribute('aria-label',pinShow?'Ocultar PIN':'Mostrar PIN')}},
 'pin-eye2':function(el){var on=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',on);el.textContent=on?'Ocultar PIN':'Mostrar PIN';$$('#pin0,#pin1,#pin2').forEach(function(i){i.type=on?'text':'password'})},
 'pin-new':function(){pinForm('new')},
 'pin-change':function(){pinForm('change')},
 'pin-remove':function(){pinForm('remove')},
 'pin-new-do':function(){savePin('new')},
 'pin-change-do':function(){savePin('change')},
 'pin-remove-do':function(){checkCurrent().then(function(ok){if(!ok)return pinErr('El PIN actual no es correcto.');try{localStorage.removeItem(PINKEY)}catch(e){}pinCfg=null;closeModal();render();toast('PIN desactivado')})},
 'pin-forgot':function(){forgotUI()},
 'pin-back-lock':function(){pbuf='';drawLock('Ingresa tu PIN')},
 'pin-recover':function(){
  var v=normRec(($('#recIn')||{}).value);
  sha(pinCfg.salt+':'+v).then(function(h){
    if(v&&h===pinCfg.rh){try{localStorage.removeItem(PINKEY)}catch(e){}pinCfg=null;unlock();render();toast('PIN eliminado. Crea uno nuevo en Ajustes.')}
    else forgotUI('Código incorrecto',true);
  });
 }
});
document.addEventListener('keydown',function(e){
  if(document.body.classList.contains('locked')){
    var t=e.target;
    if(t&&t.id==='recIn'){if(e.key==='Enter'){e.preventDefault();acts['pin-recover']()}return}
    if(/^[0-9]$/.test(e.key)&&t&&t.id!=='pinBar'){var pb=$('#pinBar');if(pb&&!pb.disabled)pb.focus()}
    return;
  }
  if(e.key==='Enter'&&e.target&&/^pin[012]$/.test(e.target.id)){e.preventDefault();var b=$('#modalRoot .mf .btn:last-child');if(b)b.click()}
});
document.addEventListener('input',function(e){var t=e.target;if(!t)return;if(t.id==='pinBar'){onlyDigits(t);if(t.value.length===4)pinCheck(t.value);return}if(/^pin[012]$/.test(t.id))onlyDigits(t)});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();return}
  if(pinCfg&&hiddenAt&&Date.now()-hiddenAt>5*60000&&!document.body.classList.contains('locked'))showLock();
});
loadPin();
if(pinCfg){document.body.classList.add('locked');drawLock('Ingresa tu PIN')}

applyTheme();
route=getRoute();
render();
initCloud();
})();
</script>
